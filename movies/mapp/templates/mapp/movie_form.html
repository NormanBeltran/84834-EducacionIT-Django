{% extends 'mapp/base.html' %}
{% load static %}

{% block title %}
    Alta de Películas
{% endblock title %}

{% block content %}
<main role="main" class="container">
<div class="container-fluid bg-secondary my-5">
    <div class="container">
        <div class="text-center pb-2">
            <div class="col-lg-8 py-2 py-lg-2">
                <form action="" method="post" enctype='multipart/form-data'>
                    {% csrf_token %}
                    <table>
                    {{ form.as_table }}
                    </table>
                    <input type="submit" class="btn btn-primary" value="Crear/Actualizar Película">
                </form>
            </div>    
        </div>
    </div>
</main>
{% endblock content %}
