<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos</title>
</head>
<body>
    <h1>Lista de Cursos</h1>

    <h3>Cursos:</h3>

    <table style="border:2px solid black; border-collapse: collapse;">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Inscriptos</th>
            </tr>
        </thead>
        <tbody>
        {% for id, nombre, inscriptos in cursos %}
                <tr>
                    <td>{{ id }}</td>
                    <td>{{ nombre }}</td>
                    <td>{{ inscriptos }}</td>
                </tr>
        {% endfor %}
        </tbody>
    </table>
</body>
</html>
